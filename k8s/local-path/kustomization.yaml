apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Pin the upstream release. Do not track master for cluster infrastructure.
resources:
  - github.com/rancher/local-path-provisioner/deploy?ref=v0.0.36

patches:
  # Local Path Provisioner creates privileged helper pods on the selected node.
  - target:
      version: v1
      kind: Namespace
      name: local-path-storage
    patch: |-
      apiVersion: v1
      kind: Namespace
      metadata:
        name: local-path-storage
        labels:
          pod-security.kubernetes.io/enforce: privileged

  # Put every dynamically created PV directory on Talos's EPHEMERAL-backed
  # user-volume path instead of the upstream /opt default.
  - target:
      version: v1
      kind: ConfigMap
      name: local-path-config
      namespace: local-path-storage
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: local-path-config
        namespace: local-path-storage
      data:
        config.json: |-
          {
            "nodePathMap": [
              {
                "node": "DEFAULT_PATH_FOR_NON_LISTED_NODES",
                "paths": ["/var/mnt/local-pvs"]
              }
            ]
          }

  # Delay provisioning until the scheduler selects an eligible worker. Retain
  # database directories if a PVC is accidentally deleted; cleanup is manual.
  - target:
      group: storage.k8s.io
      version: v1
      kind: StorageClass
      name: local-path
    patch: |-
      apiVersion: storage.k8s.io/v1
      kind: StorageClass
      metadata:
        name: local-path
      reclaimPolicy: Retain
      volumeBindingMode: WaitForFirstConsumer
      allowedTopologies:
        - matchLabelExpressions:
            - key: local-pv
              values:
                - "true"
